         x="20" y="30" width="40" height="40" transform="rotate(-15 40 50)" class="icon"/>

  <!-- Campfire -->
  <image href="campfire.png" 
         x="120" y="60" width="35" height="35" transform="rotate(20 137 77)" class="icon"/>

  <!-- Pine tree -->
  <image href="forest.png" 
