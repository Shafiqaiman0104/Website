<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customer Reviews</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 30px auto;
    background: #f9f9f9;
    padding: 20px;
  }
  h2 {
    text-align: center;
    margin-bottom: 10px;
  }

  /* Header section */
  .reviews-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .reviews-header img.es-google-logo {
    width: 40px;
    height: 40px;
    object-fit: contain;
  }
  .es-rating-value {
    font-size: 1.6rem;
    font-weight: bold;
    color: #333;
  }
  .es-rating-bar-container {
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .es-rating-bar-container img {
    width: 20px;
    height: 20px;
  }
  .es-header-rating-reviews-count {
    font-size: 0.9rem;
    color: #666;
  }

  /* Carousel Container */
  .carousel-wrapper {
    position: relative;
    overflow-x: hidden;
    overflow-y: visible;
    padding-bottom: 20px;
  }
  .carousel {
    display: flex;
    gap: 15px;
    transition: transform 0.3s ease-in-out;
  }
  .review {
    width: 300px;
    flex: 0 0 auto;
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    word-wrap: break-word;
  }

  .avatar {
    position: relative;
    flex-shrink: 0;
    margin-bottom: 10px;
  }
  .avatar img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
  }
  .avatar-badge {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: url('https://img.icons8.com/color/48/google-logo.png') no-repeat center/contain;
  }

  .review-content {}
  .review-header {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .author {
    font-weight: bold;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .es-verified-badge {
    display: inline-block;
    width: 16px;
    height: 16px;
    background: url('https://img.icons8.com/color/48/checked.png') no-repeat center/contain;
  }
  .date {
    font-size: 0.8rem;
    color: #666;
    margin-top: 2px;
  }

  .rating {
    display: flex;
    gap: 2px;
    margin: 5px 0;
  }
  .rating img {
    width: 18px;
    height: 18px;
  }
  .review-text {
    font-size: 0.9rem;
    color: #333;
    word-break: break-word;
  }

  /* Arrows */
  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.9);
    border: 1px solid #ccc;
    border-radius: 50%;
    width: 35px;
    height: 35px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1.2rem;
    z-index: 10;
  }
  .prev { left: -15px; }
  .next { right: -15px; }

  /* Responsive */
  @media (max-width: 600px) {
    .review { width: 80%; }
  }
</style>
</head>
<body>

<h2>Customer Reviews</h2>

<!-- New reviews header section -->
<div id="reviews-header" class="reviews-header"></div>

<div class="carousel-wrapper">
  <button class="carousel-btn prev">&#8249;</button>
  <div class="carousel" id="reviews-carousel"></div>
  <button class="carousel-btn next">&#8250;</button>
</div>

<script>
const fullStarImg = "https://img.icons8.com/?size=100&id=19417&format=png&color=000000";
const halfStarImg = "https://img.icons8.com/?size=100&id=19323&format=png&color=000000";
const emptyStarImg = "https://img.icons8.com/?size=100&id=19295&format=png&color=000000";

function generateStars(rating) {
  const fullStars = Math.floor(rating);
  const halfStar = rating % 1 >= 0.5 ? 1 : 0;
  const emptyStars = 5 - fullStars - halfStar;

  let starsHtml = "";
  for (let i = 0; i < fullStars; i++) starsHtml += `<img src="${fullStarImg}" alt="★">`;
  if (halfStar) starsHtml += `<img src="${halfStarImg}" alt="☆">`;
  for (let i = 0; i < emptyStars; i++) starsHtml += `<img src="${emptyStarImg}" alt="☆">`;

  return starsHtml;
}

fetch('reviews.json')
  .then(res => res.json())
  .then(data => {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = data.content;

    const carousel = document.getElementById('reviews-carousel');
    const headerContainer = document.getElementById('reviews-header');

    /* ==== HEADER SECTION ==== */
    const ratingValue = tempDiv.querySelector('.es-rating-value')?.textContent || '';
    const ratingNum = parseFloat(ratingValue) || 0;
    const reviewsCount = tempDiv.querySelector('.es-header-rating-reviews-count')?.textContent || '';

    const headerEl = document.createElement('div');
    headerEl.className = 'reviews-header';
    headerEl.innerHTML = `
      <img class="es-google-logo" src="https://static.elfsight.com/icons/app-all-in-one-reviews-logos-google-logo-multicolor.svg" alt="Google" />
      <span class="es-rating-value">${ratingValue}</span>
      <div class="es-rating-bar-container">${generateStars(ratingNum)}</div>
      <span class="es-header-rating-reviews-count">${reviewsCount}</span>
    `;
    headerContainer.appendChild(headerEl);

    /* ==== REVIEWS CARDS ==== */
    const reviewNodes = tempDiv.querySelectorAll('.es-review-container');

    reviewNodes.forEach(node => {
      const avatar = node.querySelector('.es-avatar-image')?.src || '';
      const author = node.querySelector('.es-review-author-name')?.textContent || 'Anonymous';
      const ratingNum = node.querySelectorAll('.es-rating-stars-item-filled').length +
                        (node.querySelectorAll('.es-rating-stars-item-half').length ? 0.5 : 0);
      const text = node.querySelector('.es-text-shortener')?.textContent || '';
      const date = node.querySelector('.es-review-info-date')?.textContent || '';

      const reviewEl = document.createElement('div');
      reviewEl.className = 'review';
      reviewEl.innerHTML = `
        <div class="avatar">
          <img src="${avatar}" alt="${author}">
          <span class="avatar-badge"></span>
        </div>
        <div class="review-content">
          <div class="review-header">
            <div class="author">
              ${author}
              <span class="es-verified-badge"></span>
            </div>
          </div>
          <div class="date">${date}</div>
          <div class="rating">${generateStars(ratingNum)}</div>
          <div class="review-text">${text}</div>
        </div>
      `;
      carousel.appendChild(reviewEl);
    });

    /* ==== CAROUSEL FUNCTIONALITY ==== */
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');
    let scrollAmount = 0;

    function getScrollStep() {
      const card = carousel.querySelector('.review');
      const gap = 15;
      return card ? card.offsetWidth + gap : 315;
    }

    let scrollStep = getScrollStep();

    window.addEventListener('resize', () => {
      scrollStep = getScrollStep();
    });

    nextBtn.addEventListener('click', () => {
      scrollAmount += scrollStep;
      if(scrollAmount > carousel.scrollWidth - carousel.clientWidth){
        scrollAmount = 0;
      }
      carousel.style.transform = `translateX(-${scrollAmount}px)`;
    });

    prevBtn.addEventListener('click', () => {
      scrollAmount -= scrollStep;
      if(scrollAmount < 0) scrollAmount = 0;
      carousel.style.transform = `translateX(-${scrollAmount}px)`;
    });

    // Auto swipe every 3 seconds
    setInterval(() => {
      nextBtn.click();
    }, 3000);

  })
  .catch(err => console.error(err));
</script>

</body>
</html>
